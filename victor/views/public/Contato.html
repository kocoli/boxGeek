</head>
<body>
    <aside id="sidebar" class="sidebar close">
        <nav class="nav-sidebar">
            <ul class="ul-sidebar">
    <li>

            <span>Início</span>

    </li>

    <li>
        <a href="sobre.html">
            <i class="fa-solid fa-circle-info"></i>
            <span>Sobre</span>
        </a>
    </li>

    <li>
        <a href="contato.html">
            <i class="fa-solid fa-envelope"></i>
            <span>Contato</span>
        </a>
    </li>

    <li>
        <a href="faq.html">
            <i class="fa-solid fa-circle-question"></i>
            <span>FAQ</span>
        </a>
    </li>

    <li>
        <a href="cadastro.html">
            <i class="fa-solid fa-user-plus"></i>
            <span>Cadastro</span>
        </a>
    </li>

    <li>
        <a href="login.html">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Login</span>
        </a>
    </li>

    <li>
        <a href="#" class="a-logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Sair</span>
        </a>

</ul>
        </nav>
    </aside>

    <header class="header-container">
        <div class="logo">
            <button id="btn-burger" class="btn-icon"><i class="fa-solid fa-bars"></i></button>
            <h1 class="logo-title">GEEK<span class="txt-emphasis">BOX</span></h1>
        </div>
        <nav class="header-nav-user">
            <button class="btn-icon"><i class="fa-solid fa-bell"></i></button>
            <div class="profile">
                <img src="https://i.pravatar.cc/150" alt="avatar" class="img-avatar-profile">
                <span>Alê-san</span>
            </div>
        </nav>
    </header>
    <main class="container">

    <section class="page-panel">

        <h2>Entre em Contato</h2>

        <div class="contact-grid">

            <div class="contact-card">
                <i class="fa-solid fa-location-dot"></i>
                <h3>Endereço</h3>
                <p>Rua Geek, 123</p>
            </div>

            <div class="contact-card">
                <i class="fa-solid fa-phone"></i>
                <h3>Telefone</h3>
                <p>(51) 99999-9999</p>
            </div>

            <div class="contact-card">
                <i class="fa-solid fa-envelope"></i>
                <h3>Email</h3>
                <p>contato@geekbox.com.br</p>
            </div>

        </div>

        <form class="geek-form">

            <div class="form-group">
                <label>Nome</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Mensagem</label>
                <textarea></textarea>
            </div>

            <button class="btn-primary">
                Enviar Mensagem
            </button>

        </form>

    </section>

</main>
    <main class="container">
    </main>
    <script src="../../assets/js/menus.js"></script>
